name: Validate grand-report-overrides.json

on:
  pull_request:
    paths:
      - docs/data/grand-report-overrides.json
      - .github/scripts/validate-grand-report-overrides.py

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON structure
        run: python3 .github/scripts/validate-grand-report-overrides.py docs/data/grand-report-overrides.json
